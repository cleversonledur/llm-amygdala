[project]
name = "llm-amygdala"
version = "0.1.0"
description = "A danger probe that reads a small agent model's hidden state and steers it toward caution only when a tool call could destroy something."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7",
    "transformers>=4.56",
    "accelerate>=1.0",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
amygdala = "amygdala.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amygdala"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
